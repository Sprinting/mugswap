<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mugswap</title>
  <meta name="description" content="Put your face on any short clip. Runs entirely in your browser." />
  
</head>
<body>
  <main>
    <header>
      <h1>mugswap</h1>
      <p class="tag">Put your mug on any short clip. Runs entirely in your browser; nothing is uploaded.</p>
    </header>

    <section id="step-selfie">
      <h2><span>1</span> Your selfie</h2>
      <div class="row">
        <label class="btn">Upload photo<input id="selfie-file" type="file" accept="image/*" hidden /></label>
        <button id="cam-start" class="btn ghost">Use webcam</button>
        <button id="cam-snap" class="btn" hidden>Take photo</button>
      </div>
      <video id="cam" class="mirror" playsinline muted hidden></video>
      <canvas id="selfie-view" hidden></canvas>
      <p id="selfie-msg" class="msg"></p>
    </section>

    <section id="step-clip">
      <h2><span>2</span> A short clip</h2>
      <div class="row">
        <label class="btn">Upload video<input id="clip-file" type="file" accept="video/*" hidden /></label>
        <span class="hint">Up to 10 s is used; larger than 720p is scaled down.</span>
      </div>
      <div id="progress" hidden><div id="bar"></div><span id="progress-text"></span></div>
      <canvas id="clip-view" hidden></canvas>
      <div id="player" class="row" hidden>
        <button id="play" class="btn ghost">Play</button>
        <input id="scrub" type="range" min="0" value="0" step="1" />
        <span id="frame-label" class="hint"></span>
      </div>
      <p id="clip-msg" class="msg"></p>
    </section>

    <footer>Free, no sign-up. Your photos and videos never leave this tab.</footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
